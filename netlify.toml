[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
  # Next.js's Turbopack build cache writes incremental artifacts that can
  # contain literal env var values (e.g. RESEND_API_KEY) as part of cached
  # module output. That cache is never served to visitors, but Netlify's
  # secrets scanner still flags it as a false positive — tell it to skip
  # the cache directory instead of scanning it.
  SECRETS_SCAN_OMIT_PATHS = "**/.next/cache/**"

# Explicitly declare the Next.js runtime plugin — without it, the site
# serves static files directly instead of routing through Next.js's
# serverless functions, and every page 404s. `publish` above is set
# explicitly for the same reason: this site's UI settings had it resolving
# to the repo root (same as the base directory), which the plugin refuses
# to build against.
[[plugins]]
  package = "@netlify/plugin-nextjs"
